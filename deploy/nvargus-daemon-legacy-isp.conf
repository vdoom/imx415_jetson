# systemd drop-in for nvargus-daemon - JetPack 7 / L4T R39.
# Installed as /etc/systemd/system/nvargus-daemon.service.d/10-legacy-isp-config.conf
# by install_on_target.sh (step 6) and install_camera_hotfix.sh.
#
# R39 makes a binary NITO tuning file mandatory for Argus; no IMX415 NITO
# exists. With NVIDIA's JetPack 7.2.1 camera hotfix installed
# (install_camera_hotfix.sh), NVCAMERA_NITO_PATH=CONFIG puts the daemon in
# legacy text-configuration mode (built-in defaults + camera_overrides.isp,
# exactly what JetPack 6 did) and additionally auto-converts the dumped
# binary cfg into $HOME/<badge>.nito via /usr/sbin/nvcfg2nito. The stock
# (un-hotfixed) daemon refuses CONFIG mode: "not allowed anymore".
#
# HOME: the daemon derives the cfg dump / NITO output path from it and
# aborts without one ("Environmental variable HOME is not found").
# The daemon runs as root, so use root's home.
#
# After tools/nito_migrate.sh has produced the IMX415 NITO, the "install"
# phase replaces this file with nvargus-daemon-nito.conf (native NITO mode).
[Service]
Environment=NVCAMERA_NITO_PATH=CONFIG
Environment=HOME=/root
