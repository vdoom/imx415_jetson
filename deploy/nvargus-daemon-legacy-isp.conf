# systemd drop-in for nvargus-daemon - JetPack 7 / L4T R39.
# Installed by install_on_target.sh as
#   /etc/systemd/system/nvargus-daemon.service.d/10-legacy-isp-config.conf
#
# R39 makes the binary NITO tuning file mandatory: without a NITO for the
# module the daemon aborts ISP init ("NvCameraIspGetNitoPathIfEnabled()
# returned error", 2026-09-16). The documented escape hatch
# NVCAMERA_NITO_PATH=CONFIG only dumps the merged legacy config to
# $HOME/binary.cfg and then refuses to run ("not allowed anymore") - the dump
# must be converted to a NITO with NVIDIA's Windows tool from the Camera
# Partner Toolkit, which we do not have. No IMX415 NITO exists.
#
# Stand-in: point the daemon at the stock IMX219 NITO (Sony, 10-bit Bayer,
# pedestal 64 - the closest of the shipped files). The ISP then runs with
# IMX219 tuning on the IMX415; camera_overrides.isp is still read on top
# (log: "Found override file"). Replace with a real imx415.nito when one
# exists. HOME is kept: the daemon derives its NITO dump path from it.
[Service]
Environment=NVCAMERA_NITO_PATH=/var/nvidia/nvcam/settings/imx219.nito
Environment=HOME=/root
