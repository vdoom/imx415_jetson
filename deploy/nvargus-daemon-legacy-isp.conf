# systemd drop-in for nvargus-daemon - JetPack 7 / L4T R39.
# Installed by install_on_target.sh as
#   /etc/systemd/system/nvargus-daemon.service.d/10-legacy-isp-config.conf
#
# R39 makes the binary NITO tuning file the default: without a
# <module>.nito in /var/nvidia/nvcam/settings the daemon aborts ISP init
# ("NvCameraIspGetNitoPathIfEnabled() returned error", seen 2026-09-16).
# No NITO exists for the IMX415 (NVIDIA's Camera Partner Toolkit is needed to
# make one). NVIDIA's own error text documents this switch back to the
# legacy configuration path, which is what camera_overrides.isp targets and
# what JetPack 6 used unconditionally.
[Service]
Environment=NVCAMERA_NITO_PATH=CONFIG
