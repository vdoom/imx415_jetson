# systemd drop-in for nvargus-daemon - JetPack 7 / L4T R39, NATIVE NITO MODE.
# Installed as /etc/systemd/system/nvargus-daemon.service.d/10-legacy-isp-config.conf
# by `sudo tools/nito_migrate.sh install`, replacing the CONFIG-mode file
# once /var/nvidia/nvcam/settings/<badge>.nito for the IMX415 exists.
#
# NVCAMERA_NITO_PATH unset = default NITO lookup in /var/nvidia/nvcam/settings.
# NVCAMERA_NITO_DUMP_PATH=0 = do not regenerate the cfg/NITO at every start
# (NVIDIA IQ Migration Tools guide, 2.1.4.2). HOME kept for the daemon's
# path handling.
[Service]
Environment=NVCAMERA_NITO_DUMP_PATH=0
Environment=HOME=/root
